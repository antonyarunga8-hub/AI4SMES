<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI4SMEs Africa | Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0E17;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    .code {
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #10b981, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 1rem 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #10b981;
      color: #0A0E17;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #059669; }
    .brand {
      margin-top: 2rem;
      font-size: 0.625rem;
      color: #475569;
      font-weight: 600;
    }
  </style>
  <!-- GitHub Pages SPA redirect script -->
  <script>
    // Single Page App redirect for GitHub Pages
    // Redirects all 404s back to index.html with the path stored in sessionStorage
    var pathSegmentsToKeep = 1; // Keep /AI4SMES/ prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. Let's get you back to your AI Business Operating System.</p>
    <a href="./" class="btn">← Back to AI4SMEs</a>
    <div class="brand">AI4SMEs Africa • Pan-African Business Operating System</div>
  </div>
</body>
</html>
